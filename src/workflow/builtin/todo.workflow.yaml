schema: "1.0"
name: todo
description: "Lightweight task tracking — pure in-memory, no files"
triggerKeywords:
  - todo
  - task
  - "break down"
  - "step by step"
relatedTools:
  - read
  - write
  - edit
  - glob
  - grep
  - bash

init:
  taskFrom: "params.task"
  data:
    phase:
      type: string
      default: analyze
    analysis:
      type: string
      default: ""
    steps:
      type: array
      default: []
  phaseField: data

phases:
  - name: analyze
    description: "Model analyzes the task using add/note actions"
    actions:
      - add
      - note
      - progress
      - complete
    stepSource:
      type: memory
      field: steps
    onAction:
      add:
        source: memory
        pushToMemory: true
      note:
        appendToData: analysis
      progress:
        appendToData: analysis
      complete:
        transition: execute
        validate:
          - type: data
            field: steps
            condition: non-empty
            message: "No steps added yet. Use workflow add to create task steps first."
    render:
      persistent:
        type: template
        template: modes/todo
        staticVars:
          task: "{task}"
      step:
        type: none

  - name: execute
    description: "Execute steps one by one from memory"
    actions:
      - done
      - blocked
      - add
      - note
      - progress
      - complete
    stepSource:
      type: memory
      field: steps
    onAction:
      done:
        source: memory
        setStatus: completed
        autoAdvance: true
      blocked:
        source: memory
        setStatus: blocked
        autoAdvance: true
      add:
        source: memory
        pushToMemory: true
      note:
        appendToData: analysis
      progress:
        appendToData: analysis
      complete:
        transition: null
    render:
      persistent:
        type: composite
        sections:
          - type: data-content
            field: analysis
            prefix: "### Analysis\n"
            fallback: ""
          - type: progress-summary
            fromMemory: true
            title: "TODO: {task}"
      step:
        type: current-step
        stepLabel: Step
        showWorkflowCommand: true

complete:
  condition: phase-and-all-done
  phase: execute

onDeactivate: none
