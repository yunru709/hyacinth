schema: "1.0"
name: spec
description: "Specification-driven development — three documents x three phases"
triggerKeywords:
  - spec
  - specification
  - requirement
  - design
relatedTools:
  - read
  - write
  - edit
  - glob
  - grep

init:
  taskFrom: "params.task"
  workDir:
    base: "~/.agent/workflows"
    segments:
      - spec
      - "{slug}"
  staticVars:
    slug:
      compute: slug
      from: "{task}"
      maxLen: 60
      fallback: "spec"
  data:
    phase:
      type: string
      default: spec
  phaseField: both

phases:
  - name: spec
    description: "Create spec.md, tasks.md, checklist.md simultaneously"
    actions:
      - complete
    stepSource:
      type: none
    onAction:
      complete:
        transition: tasks
        validate:
          - type: file
            path: "{workDir}/spec.md"
            condition: non-empty
            message: "spec.md is missing or empty. Create it first."
          - type: file
            path: "{workDir}/tasks.md"
            condition: has-checkboxes
            message: "tasks.md has no steps. Create it first with ## sections and - [ ] steps."
          - type: file
            path: "{workDir}/checklist.md"
            condition: non-empty
            message: "checklist.md is missing or empty. Create it first."
    render:
      persistent:
        type: template
        template: modes/spec-phase1
        staticVars:
          task: "{task}"
          specDir: "{workDir}"
      step:
        type: none

  - name: tasks
    description: "Execute implementation tasks from tasks.md"
    actions:
      - done
      - blocked
      - add
      - note
      - progress
    stepSource:
      type: file
      path: "{workDir}/tasks.md"
      format: sectioned
    stepNameTemplate: "[{section}] {text}"
    onAction:
      done:
        source: file
        markFile: x
      blocked:
        source: file
        markFile: blocked
        autoAdvance: true
      add:
        source: file
        appendToFile: true
      note:
        appendToData: notes
      progress:
        appendToData: notes
    autoTransition:
      when: all-steps-done
      toPhase: checklist
    render:
      persistent:
        type: composite
        sections:
          - type: file-content
            file: "{workDir}/spec.md"
            onMissing: empty
          - type: progress-summary
            title: "Spec: {task}"
            file: "{workDir}/tasks.md"
      step:
        type: current-step
        stepLabel: Task
        showWorkflowCommand: true

  - name: checklist
    description: "Verify against checklist.md"
    actions:
      - done
      - blocked
      - add
      - note
      - progress
    stepSource:
      type: file
      path: "{workDir}/checklist.md"
      format: flat
    onAction:
      done:
        source: file
        markFile: x
      blocked:
        source: file
        markFile: blocked
        autoAdvance: true
      add:
        source: file
        appendToFile: true
      note:
        appendToData: notes
      progress:
        appendToData: notes
    render:
      persistent:
        type: composite
        sections:
          - type: file-content
            file: "{workDir}/spec.md"
            onMissing: empty
          - type: progress-summary
            title: "Spec: {task}"
            file: "{workDir}/checklist.md"
      step:
        type: current-step
        stepLabel: "Checklist Item"
        showWorkflowCommand: true

complete:
  condition: phase-and-all-done
  phase: checklist
  file: "{workDir}/checklist.md"

onDeactivate: none
