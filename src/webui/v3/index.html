<!DOCTYPE html>
<html lang="zh-CN" data-palette="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyacinth</title>

  <!-- 只加载：基础尺度 + 配色 + 共享控制台/设置样式。结构与交互由设计语言自己带。 -->
  <link rel="stylesheet" href="/v3/css/base.css">
  <link rel="stylesheet" href="/v3/css/palettes.css">
  <link rel="stylesheet" href="/v3/css/console.css">

  <script type="module">
    /* ========================================================================
       v3 壳 —— 只做「加载/卸载设计语言」，不写任何界面。

       ⚠️ 2026-10-27 改为 **SPA 无缝切换**（孑遗："这几个页面不是跳，本来就应该是一体的"）：
        - 连接只 boot 一次：语言模块用 `window.__v3app || (window.__v3app = boot())` 复用同一条 ws
        - 切换语言 = dispose 旧语言（清监听/清 #app）→ 换 style.css → 动态 import 新语言
        - 连接不断、页面不刷新；URL 用 history.replaceState 更新 ?lang=（不追加历史）
        - 每套语言的 style.css 切换时必须移除旧的，否则多套骨架 CSS 打架

       语言标识 → 目录：terminal 复用 langs/tui（目录名/类名属内部实现）
       切换入口仍在「设置 → 外观 → 设计语言」（调 window.__switchLang，不再整页跳）
       classic（v1）不在此壳内 —— 它是独立整页应用，由设置里的「经典」项 location.href='/' 进入。
       ======================================================================== */
    const DIR = { terminal: 'tui', editorial: 'editorial', brutalist: 'brutalist' };
    const ALIAS = { tui: 'terminal' };
    const ALLOWED = Object.keys(DIR);
    const q = new URLSearchParams(location.search);
    let fromUrl = q.get('lang');
    if (ALIAS[fromUrl]) fromUrl = ALIAS[fromUrl];
    let saved = localStorage.getItem('v3.lang');
    if (ALIAS[saved]) saved = ALIAS[saved];
    const LANG0 = ALLOWED.includes(fromUrl) ? fromUrl : (ALLOWED.includes(saved) ? saved : 'terminal');

    const appEl = () => document.getElementById('app');
    let currentLangKey = null;
    let currentMod = null;
    let currentLink = null;

    async function switchLang(name) {
      if (ALIAS[name]) name = ALIAS[name];
      if (!ALLOWED.includes(name)) {
        appEl().textContent = `未知设计语言：${name}（可选：${ALLOWED.join(' / ')}）`;
        return;
      }
      if (name === currentLangKey && currentMod) return; // 已是当前

      // 1) 卸载旧语言（清监听 + 清 #app），但**不动共享 ws**
      if (currentMod && typeof currentMod.dispose === 'function') {
        try { currentMod.dispose(); } catch (e) { console.warn('[shell] dispose 失败', e); }
      }
      currentMod = null;
      if (appEl()) appEl().innerHTML = '';
      if (currentLink && currentLink.parentNode) currentLink.parentNode.removeChild(currentLink);
      currentLink = null;

      // 2) 挂新语言样式（先样式后脚本，避免先渲染一帧无样式内容）
      const dir = DIR[name];
      await new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `/v3/langs/${dir}/style.css`;
        link.onload = () => { currentLink = link; resolve(); };
        link.onerror = () => reject(new Error('样式缺失: ' + link.href));
        document.head.appendChild(link);
      }).catch((e) => { console.error(e); });

      // 3) 动态挂载新语言（?t= 强制新实例；复用 window.__v3app 的共享连接）
      try {
        const mod = await import(`/v3/langs/${dir}/index.js?t=${Date.now()}`);
        currentMod = mod;
        currentLangKey = name;
      } catch (e) {
        if (appEl()) appEl().textContent = '加载失败：' + e.message;
        console.error(e);
        return;
      }

      // 4) 记忆 + 改 URL（不整页刷新、不追加历史）
      localStorage.setItem('v3.lang', name);
      const u = new URL(location.href);
      u.searchParams.set('lang', name);
      history.replaceState(null, '', u.toString());
    }

    // 暴露给「设置 → 外观 → 设计语言」切换器（form.js）调用 —— 不再整页跳
    window.__switchLang = switchLang;
    window.__v3Lang = () => currentLangKey;

    switchLang(LANG0);
  </script>
</head>
<body>
  <!-- 空白骨架：由各设计语言填充 -->
  <div id="app"></div>
</body>
</html>
