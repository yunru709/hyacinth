<!DOCTYPE html>
<html lang="zh-CN" data-theme="hyacinth" data-density="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyacinth</title>

  <link rel="stylesheet" href="/v2/css/tokens.css">
  <link rel="stylesheet" href="/v2/css/base.css">
  <link rel="stylesheet" href="/v2/css/shell.css">
  <link rel="stylesheet" href="/v2/css/components.css">
  <link rel="stylesheet" href="/v2/css/views.css">
</head>
<body>
  <!--
    v2 结构（2026-10-27 重做）

    旧版的问题不是某个 bug，而是结构性的：
      单页内联 8 个视图（index.html 2733 行）+ 一个 8352 行的 app.js 按 id 抓 DOM。
      任何视图的改动都可能波及未知数量的地方，而且是静默的 —— 用户实际遇到的
      「进 settings 出不来」就是这类累积问题的表现。

    v2 的约定：
      1. 一个视图 = 一个 section + 一个 JS 模块，各自管理自己的 DOM 与数据
      2. 路由只负责「显示哪个 section」，不碰视图内部
      3. 所有颜色/间距/圆角只走 tokens.css 的语义令牌
      4. 主题 = 令牌覆写 + 密度切换（不只是换色）
  -->

  <div id="app">
    <!-- ── 顶栏 ─────────────────────────────────────────────────────
         只放全局动作：侧栏开关、当前位置、模型状态、设置入口。
         不放任何视图自己的按钮。 -->
    <header id="topbar">
      <button id="scope-toggle" class="tb-btn" aria-label="切换侧栏" title="切换侧栏">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
      </button>

      <div id="breadcrumb" class="tb-crumbs">
        <span class="tb-crumb is-current" data-crumb="chat">对话</span>
      </div>

      <div class="tb-spacer"></div>

      <!-- 模型状态：一直可见，点开进模型页 -->
      <button id="model-chip" class="tb-chip" title="当前模型">
        <span class="tb-chip-dot" id="model-dot"></span>
        <span id="model-name">连接中…</span>
      </button>

      <button id="theme-btn" class="tb-btn" aria-label="切换主题" title="切换主题">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z"/></svg>
      </button>

      <button id="settings-btn" class="tb-btn" aria-label="设置" title="设置">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg>
      </button>
    </header>

    <div id="workspace">
      <!-- ── 侧栏 ───────────────────────────────────────────────────
           三段式：新建 / 会话列表（占满剩余） / 导航（贴底）。
           会话列表是唯一可滚动区，导航永远可见 —— 旧版把导航放在
           滚动区里，会话一多导航就被推走，这是"找不到出口"的成因之一。 -->
      <aside id="sidebar">
        <div class="sb-head">
          <button id="new-session" class="sb-new" title="新会话">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
            <span>新会话</span>
          </button>
        </div>

        <div class="sb-search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <input id="session-filter" type="search" placeholder="搜索会话" autocomplete="off" aria-label="搜索会话">
        </div>

        <nav id="session-list" class="sb-list" aria-label="会话列表"></nav>

        <nav class="sb-nav" aria-label="主导航">
          <a href="#/chat" class="sb-nav-item" data-view="chat">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12v8H6l-4 3z"/></svg>
            <span>对话</span>
          </a>
          <a href="#/model" class="sb-nav-item" data-view="model">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/><path d="M6 1v2M10 1v2M6 13v2M10 13v2M1 6h2M1 10h2M13 6h2M13 10h2"/></svg>
            <span>模型</span>
          </a>
          <a href="#/sessions" class="sb-nav-item" data-view="sessions">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v6a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12z"/></svg>
            <span>会话</span>
          </a>
          <a href="#/skills" class="sb-nav-item" data-view="skills">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.8 4.2 4.2.4-3.2 2.9 1 4.5L8 11l-3.8 2.5 1-4.5L2 6.1l4.2-.4z"/></svg>
            <span>技能</span>
          </a>
          <a href="#/plugins" class="sb-nav-item" data-view="plugins">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4v3h3v4h-3v3H6v-3H3V5h3z"/></svg>
            <span>插件</span>
          </a>
          <a href="#/schedule" class="sb-nav-item" data-view="schedule">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v2.5M10.5 1.5v2.5"/></svg>
            <span>定时</span>
          </a>
        </nav>

        <div class="sb-foot">
          <span id="conn-state" class="sb-conn" data-state="offline">离线</span>
          <span id="version-label" class="sb-ver">v2</span>
        </div>
      </aside>

      <!-- ── 主区 ───────────────────────────────────────────────────
           所有视图平铺在这里，同一时刻只有一个不 hidden。
           路由切换只改 hidden 属性 —— 不重建 DOM，不丢状态。 -->
      <main id="main">

        <!-- 对话视图 -->
        <section class="view" data-view="chat" aria-label="对话">
          <div id="tabbar" class="tabbar" hidden>
            <div id="tab-list" class="tab-list" role="tablist"></div>
            <button id="tab-new" class="tab-new" aria-label="新建会话标签" title="新建会话标签">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
            </button>
          </div>

          <div id="panes" class="panes">
            <div id="chat-surface" class="chat-surface">
              <div id="messages" class="messages" data-scroll-region="primary"></div>

              <div id="empty-state" class="empty-state">
                <div class="empty-mark">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-1 3.5-2.5 5-6 6 3.5 1 5 2.5 6 6 1-3.5 2.5-5 6-6-3.5-1-5-2.5-6-6z"/></svg>
                </div>
                <h1 class="empty-title">开始一段对话</h1>
                <p class="empty-sub">问我任何事，或者从下面挑一个开始。</p>
                <div class="empty-suggestions">
                  <button class="sug" data-prompt="帮我看看这个项目现在有什么问题">梳理这个项目的现状</button>
                  <button class="sug" data-prompt="解释一下这段代码的逻辑">解释一段代码</button>
                  <button class="sug" data-prompt="今天有什么值得关注的事">随便聊聊</button>
                </div>
              </div>

              <div id="composer" class="composer">
                <div class="composer-box">
                  <textarea id="input" rows="1" placeholder="发消息…" aria-label="消息输入框"></textarea>
                  <div class="composer-actions">
                    <button id="stop-btn" class="cmp-btn" hidden title="停止">
                      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1"/></svg>
                    </button>
                    <button id="send-btn" class="cmp-send" title="发送">
                      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8L2 2l2.5 6L2 14z"/></svg>
                    </button>
                  </div>
                </div>
                <div class="composer-hint">
                  <kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 其余视图由 JS 填充（骨架先留空容器，避免一次性写 8 个大 section） -->
        <section class="view" data-view="model" hidden aria-label="模型"></section>
        <section class="view" data-view="sessions" hidden aria-label="会话"></section>
        <section class="view" data-view="skills" hidden aria-label="技能"></section>
        <section class="view" data-view="plugins" hidden aria-label="插件"></section>
        <section class="view" data-view="schedule" hidden aria-label="定时"></section>
        <section class="view" data-view="settings" hidden aria-label="设置"></section>
      </main>
    </div>
  </div>

  <script type="module" src="/v2/js/main.js"></script>
</body>
</html>
