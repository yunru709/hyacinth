name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 包管理器必须是 pnpm（2026-09-19 修）─────────────────────────────
      # 本仓库声明的包管理器就是 pnpm（package.json 的 packageManager 字段），
      # 而这里原先写的是 `npm ci || npm install` —— 那才是异常，并且是 CI 长期红的**根因**：
      #   · pnpm 默认**不执行**依赖的构建脚本（未在 pnpm-workspace.yaml 批准的会被跳过）
      #   · npm  install **会执行** ⇒ tree-sitter-cli@0.27.0 的 install.js 挂掉
      #     （干净检出实测：npm install exit=1，123s 后失败于 node install.js）
      #   · install 失败 ⇒ 后面所有步骤根本跑不到 ⇒ 看起来"CI 一直红"
      # 换成 pnpm 后：与本地语义一致、lockfile 可复现、不再触发未批准的构建脚本。
      - uses: pnpm/action-setup@v4     # 版本取自 package.json 的 packageManager（pnpm@10.25.0）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm exec vitest run
      - name: Layer constraints
        run: pnpm run verify:layers
      - name: Build (smoke 前置：smoke-assembly 依赖 dist/)
        run: pnpm run build
      - name: Assembly smoke
        run: pnpm run smoke
